name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Build (using committed BPF bindings)
        run: go build -v ./...

      - name: Vet
        run: go vet ./...

      - name: Gofmt check
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then
            echo "gofmt needs to be run on:"
            echo "$out"
            exit 1
          fi

      - name: Test
        run: go test ./...

      # The engine closes the ring buffer reader from both a
      # context-cancellation goroutine and Close(); keep that guarded.
      - name: Test (race detector)
        run: go test -race ./...

  regenerate-check:
    runs-on: ubuntu-latest
    # Best-effort: confirms provctl.bpf.c still compiles against *some*
    # kernel's BTF and bpf2go still runs end to end. Not a hard gate — the
    # runner's kernel/BTF differs from any given dev machine's, so a byte-
    # identical match against the committed bindings isn't expected here;
    # that comparison is meaningful locally (see README "Modifying the BPF
    # probes") but not across arbitrary CI kernels.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Install clang + libbpf headers
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libbpf-dev

      # apt's bpftool (via linux-tools-generic) is a dispatcher that shells
      # out to a kernel-version-specific package which usually doesn't
      # exist for the runner's kernel (e.g. linux-tools-6.17.0-1022-azure).
      # The upstream project ships a standalone static binary instead,
      # which works on any kernel — use that. Its release asset names are
      # versioned (bpftool-vX.Y.Z-amd64.tar.gz), so resolve the current
      # one via the API rather than hardcoding a filename that breaks on
      # the next bpftool release.
      - name: Install static bpftool
        run: |
          url=$(curl -sSL https://api.github.com/repos/libbpf/bpftool/releases/latest \
            | grep -o '"browser_download_url": *"[^"]*-amd64\.tar\.gz"' \
            | grep -o 'https://[^"]*')
          curl -sSL -o /tmp/bpftool.tar.gz "$url"
          sudo tar -xzf /tmp/bpftool.tar.gz -C /usr/local/bin bpftool
          sudo chmod +x /usr/local/bin/bpftool
          bpftool version

      - name: Regenerate BPF bindings
        run: make generate

      - name: Show diff against committed bindings (informational)
        run: git diff --stat internal/engine/probes_x86_bpfel.go internal/engine/probes_x86_bpfel.o || true
