name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Build (using committed BPF bindings)
        run: go build -v ./...

      - name: Vet
        run: go vet ./...

      - name: Gofmt check
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then
            echo "gofmt needs to be run on:"
            echo "$out"
            exit 1
          fi

      - name: Test
        run: go test ./...

      # The engine closes the ring buffer reader from both a
      # context-cancellation goroutine and Close(); keep that guarded.
      - name: Test (race detector)
        run: go test -race ./...

  regenerate-check:
    runs-on: ubuntu-latest
    # Best-effort: confirms provctl.bpf.c still compiles against *some*
    # kernel's BTF and bpf2go still runs end to end. Not a hard gate — the
    # runner's kernel/BTF differs from any given dev machine's, so a byte-
    # identical match against the committed bindings isn't expected here;
    # that comparison is meaningful locally (see README "Modifying the BPF
    # probes") but not across arbitrary CI kernels.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Install clang + libbpf headers + bpftool
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libbpf-dev linux-tools-common linux-tools-generic bpftool || \
          sudo apt-get install -y clang libbpf-dev

      - name: Regenerate BPF bindings
        run: make generate

      - name: Show diff against committed bindings (informational)
        run: git diff --stat internal/engine/probes_x86_bpfel.go internal/engine/probes_x86_bpfel.o || true
